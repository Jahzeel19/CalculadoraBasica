<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Básica · NSI Software House</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="calculadora">
    <header class="encabezado">
      <span class="marca">NSI</span>
      <span class="titulo">Calculadora Básica</span>
      <button class="btn-ayuda" data-accion="ayuda" aria-label="Ayuda">?</button>
    </header>

    <section class="visor" aria-live="polite">
      <div id="expresion" class="expresion">&nbsp;</div>
      <div id="pantalla" class="pantalla">0</div>
    </section>

    <section class="teclas">
      <button class="tecla accion" data-accion="limpiar">C</button>
      <button class="tecla accion" data-accion="borrar">⌫</button>
      <button class="tecla operador" data-accion="operador" data-valor="/">÷</button>
      <button class="tecla operador" data-accion="operador" data-valor="*">×</button>

      <button class="tecla" data-accion="digito" data-valor="7">7</button>
      <button class="tecla" data-accion="digito" data-valor="8">8</button>
      <button class="tecla" data-accion="digito" data-valor="9">9</button>
      <button class="tecla operador" data-accion="operador" data-valor="-">−</button>

      <button class="tecla" data-accion="digito" data-valor="4">4</button>
      <button class="tecla" data-accion="digito" data-valor="5">5</button>
      <button class="tecla" data-accion="digito" data-valor="6">6</button>
      <button class="tecla operador" data-accion="operador" data-valor="+">+</button>

      <button class="tecla" data-accion="digito" data-valor="1">1</button>
      <button class="tecla" data-accion="digito" data-valor="2">2</button>
      <button class="tecla" data-accion="digito" data-valor="3">3</button>
      <button class="tecla igual" data-accion="igual">=</button>

      <button class="tecla cero" data-accion="digito" data-valor="0">0</button>
      <button class="tecla" data-accion="punto">.</button>
    </section>
  </main>

  <!-- Ventana de error -->
  <div class="modal" id="modal-error" role="alertdialog" aria-labelledby="titulo-error" hidden>
    <div class="ventana">
      <div class="barra error" id="titulo-error">Error</div>
      <p class="cuerpo" id="mensaje-error"></p>
      <div class="pie"><button class="btn-modal" data-cerrar>Aceptar</button></div>
    </div>
  </div>

  <!-- Ventana de ayuda -->
  <div class="modal" id="modal-ayuda" role="dialog" aria-labelledby="titulo-ayuda" hidden>
    <div class="ventana">
      <div class="barra" id="titulo-ayuda">Ayuda</div>
      <ul class="cuerpo atajos">
        <li><kbd>0-9</kbd> Escribir números</li>
        <li><kbd>+ − * /</kbd> Operaciones</li>
        <li><kbd>Enter</kbd> Calcular el resultado</li>
        <li><kbd>Backspace</kbd> Borrar un dígito</li>
        <li><kbd>Esc</kbd> Limpiar todo</li>
        <li><kbd>H</kbd> Abrir esta ayuda</li>
      </ul>
      <div class="pie"><button class="btn-modal" data-cerrar>Entendido</button></div>
    </div>
  </div>

  <script src="js/calculadora.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
